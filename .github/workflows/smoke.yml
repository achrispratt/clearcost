name: Smoke tests

# Runs the Playwright smoke suite against the live site after each
# successful Vercel production deploy, daily, and on demand.
on:
  deployment_status:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

jobs:
  smoke:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npm run test:e2e
        env:
          BASE_URL: https://www.clearcost.live

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
